[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-studio"
version = "0.1.0"
description = "Multi-agent YouTube production engine with pluggable formats, a compliance layer and a human approval step."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "moviepy>=2.1",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "streamlit>=1.35",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
tts = ["kokoro-onnx>=0.4"]
piper = ["piper-tts>=1.2"]
build_log = ["playwright>=1.45"]
youtube = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8"]
all = [
    "google-genai>=1.0", "kokoro-onnx>=0.4", "playwright>=1.45",
    "google-api-python-client>=2.100", "google-auth-oauthlib>=1.2", "pytest>=8",
]

[project.scripts]
avs = "avs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"avs" = ["formats/*/*.md", "formats/*/*.yaml", "formats/*/recipes/*/*", "formats/*/recipes/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
